<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="450" fill="#F5F7FA" rx="10" ry="10"/>
  
  <!-- 标题区域 -->
  <rect x="20" y="20" width="760" height="60" fill="#FFFFFF" rx="8" ry="8" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="55" font-family="Arial" font-size="22" font-weight="bold" fill="#4361EE">仪表盘</text>
  <circle cx="50" cy="50" r="15" fill="#4361EE"/>
  
  <!-- 统计卡片区域 -->
  <rect x="20" y="100" width="180" height="100" fill="#FFFFFF" rx="8" ry="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="20" y="100" width="40" height="100" fill="rgba(67, 97, 238, 0.1)" rx="8" ry="0"/>
  <text x="70" y="130" font-family="Arial" font-size="14" fill="#666666">总用户数</text>
  <text x="70" y="165" font-family="Arial" font-size="24" font-weight="bold" fill="#333333">1,234</text>
  <text x="70" y="185" font-family="Arial" font-size="12" fill="#52C41A">↑ 12%</text>
  
  <rect x="220" y="100" width="180" height="100" fill="#FFFFFF" rx="8" ry="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="220" y="100" width="40" height="100" fill="rgba(76, 201, 240, 0.1)" rx="8" ry="0"/>
  <text x="270" y="130" font-family="Arial" font-size="14" fill="#666666">总笔记数</text>
  <text x="270" y="165" font-family="Arial" font-size="24" font-weight="bold" fill="#333333">5,678</text>
  <text x="270" y="185" font-family="Arial" font-size="12" fill="#52C41A">↑ 8%</text>
  
  <rect x="420" y="100" width="180" height="100" fill="#FFFFFF" rx="8" ry="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="420" y="100" width="40" height="100" fill="rgba(58, 12, 163, 0.1)" rx="8" ry="0"/>
  <text x="470" y="130" font-family="Arial" font-size="14" fill="#666666">总标签数</text>
  <text x="470" y="165" font-family="Arial" font-size="24" font-weight="bold" fill="#333333">256</text>
  <text x="470" y="185" font-family="Arial" font-size="12" fill="#52C41A">↑ 5%</text>
  
  <rect x="620" y="100" width="160" height="100" fill="#FFFFFF" rx="8" ry="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="620" y="100" width="40" height="100" fill="rgba(247, 37, 133, 0.1)" rx="8" ry="0"/>
  <text x="670" y="130" font-family="Arial" font-size="14" fill="#666666">总评论数</text>
  <text x="670" y="165" font-family="Arial" font-size="24" font-weight="bold" fill="#333333">789</text>
  <text x="670" y="185" font-family="Arial" font-size="12" fill="#52C41A">↑ 15%</text>
  
  <!-- 图表区域 -->
  <rect x="20" y="220" width="380" height="210" fill="#FFFFFF" rx="8" ry="8" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="250" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">用户增长趋势</text>
  
  <!-- 简化的折线图 -->
  <polyline points="40,380 100,350 160,370 220,320 280,300 340,280 380,260" 
            fill="none" stroke="#4361EE" stroke-width="2"/>
  <path d="M40,380 L100,350 L160,370 L220,320 L280,300 L340,280 L380,260 L380,380 L40,380 Z" 
        fill="rgba(67, 97, 238, 0.1)" stroke="none"/>
  
  <!-- 饼图区域 -->
  <rect x="420" y="220" width="360" height="210" fill="#FFFFFF" rx="8" ry="8" stroke="#E2E8F0" stroke-width="1"/>
  <text x="440" y="250" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">内容类型分布</text>
  
  <!-- 简化的饼图 -->
  <circle cx="600" cy="320" r="80" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M600,320 L600,240 A80,80 0 0,1 671,291 Z" fill="#4361EE"/>
  <path d="M600,320 L671,291 A80,80 0 0,1 640,395 Z" fill="#4CC9F0"/>
  <path d="M600,320 L640,395 A80,80 0 0,1 530,380 Z" fill="#3A0CA3"/>
  <path d="M600,320 L530,380 A80,80 0 0,1 540,245 Z" fill="#F72585"/>
  <path d="M600,320 L540,245 A80,80 0 0,1 600,240 Z" fill="#7209B7"/>
  
  <!-- 图例 -->
  <rect x="440" y="290" width="10" height="10" fill="#4361EE"/>
  <text x="455" y="300" font-family="Arial" font-size="12" fill="#666666">笔记 (45%)</text>
  
  <rect x="440" y="310" width="10" height="10" fill="#4CC9F0"/>
  <text x="455" y="320" font-family="Arial" font-size="12" fill="#666666">图片 (25%)</text>
  
  <rect x="440" y="330" width="10" height="10" fill="#3A0CA3"/>
  <text x="455" y="340" font-family="Arial" font-size="12" fill="#666666">音频 (15%)</text>
  
  <rect x="440" y="350" width="10" height="10" fill="#F72585"/>
  <text x="455" y="360" font-family="Arial" font-size="12" fill="#666666">视频 (10%)</text>
  
  <rect x="440" y="370" width="10" height="10" fill="#7209B7"/>
  <text x="455" y="380" font-family="Arial" font-size="12" fill="#666666">文档 (5%)</text>
</svg>
