# ==================================================
# ZeroIsle Notes - CI/CD Pipeline (GitHub Actions)
# ==================================================
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # --- Backend Tests ---
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Type check with mypy
        run: mypy . --ignore-missing-imports

      - name: Run tests with pytest & coverage
        env:
          DJANGO_ENV: testing
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          DEBUG: True
          REDIS_HOST: localhost
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  # --- Frontend Build Verification ---
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Unit tests (Jest)
        run: yarn test --runInBand --watch=false --ci --no-cache

      - name: Lint check (ESLint)
        run: yarn lint

      # Note: Full RN build requires native toolchain (iOS/Android)
      # This just validates JS bundle can be created
      - name: Bundle verification
        run: yarn bundle:verify

  # --- Release Security Gate ---
  security-scan:
    name: Release Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject tracked secrets and debug signing assets
        shell: bash
        run: |
          set -eu
          while IFS= read -r path; do
            case "$path" in
              *.env*.example)
                continue
                ;;
              .env|.env.*|*/.env|*/.env.*|*.keystore|*.jks|*.p12|*.pfx|*/google-services.json)
                echo "Forbidden tracked release asset: $path"
                exit 1
                ;;
            esac
          done < <(git ls-files)

      - name: Reject hardcoded MongoDB credentials
        shell: bash
        run: |
          set -eu
          if rg -n --hidden -g '!.git/**' -g '!*.md' \
            'mongodb\+srv://[^[:space:]<"]+:[^[:space:]<"]+@' .; then
            echo "Hardcoded MongoDB credential detected."
            exit 1
          fi

  # --- Docker Build & Push ---
  build-push-docker:
    name: Build & Push Docker Image
    needs: [backend-test, frontend-build, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Admin System Backend (admin_system) ---
  #
  # 为什么单独加这个 job：
  # 此前 CI 只覆盖 backend/（业务后端）与 RN 应用，**完全没覆盖 admin_system**。
  # 结果是管理后台长期累积了多类只能靠人工排查的问题：无法启动、
  # 大量接口 500、前端语法错误导致从未构建成功。
  # 本 job 把所有已验证的检查固化为门禁，使同类回归在合并前被拦住。
  #
  # 全部检查使用 mongomock，不需要真实 MongoDB，因此可在 CI 直接跑。
  admin-system-backend:
    name: Admin System Backend Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_system/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: admin_system/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest mongomock

      - name: Django system check
        run: python -X utf8 manage.py check

      # 说明：pytest 里包含两类"构建与 lint 都发现不了"的守护 ——
      #   1. tests/test_frontend_service_route_contract.py：
      #      比对前端 services 调用的路径与后端真实路由，
      #      拦住"调用不存在的接口 / 页面展示 mock 假数据"这类缺陷；
      #   2. tests/test_dashboard_api.py、test_log_backup_api.py：
      #      锁定仪表盘与日志备份的字段契约。
      - name: Run backend tests
        run: python -X utf8 -m pytest -q

      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-backend-pytest-output
          path: admin_system/backend/.pytest_cache
          if-no-files-found: ignore

  # --- Admin System Endpoint Sweeps ---
  #
  # 三类端点扫描的独立 job：任何接口出现 5xx 即失败。
  # 这些扫描分别发现过 8 个接口 500、写路径校验吞成 500、
  # 17 个端点 ?search= 全部 500，是性价比最高的回归网。
  admin-system-sweeps:
    name: Admin System Endpoint Sweeps (0 x 5xx)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: admin_system/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r admin_system/backend/requirements.txt
          pip install pytest mongomock

      - name: Sweep - no-arg GET endpoints
        run: python -X utf8 scripts/sweep_endpoints_get.py

      - name: Sweep - write paths
        run: python -X utf8 scripts/sweep_endpoints_write.py

      - name: Sweep - query parameters
        run: python -X utf8 scripts/sweep_endpoints_query.py

  # --- Admin System Frontend Build ---
  #
  # 此前该前端**从未成功构建过**：package.json 缺少 4 个被 import 的依赖，
  # 另有 11 处语法/引用错误。没有构建门禁，这些都不会被发现。
  admin-system-frontend:
    name: Admin System Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_system/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: admin_system/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      # 说明：这里刻意把 CI 显式设为 false。
      # GitHub Actions 默认会设置 CI=true，而 CRA 在 CI=true 时会把 eslint
      # 的 **warning** 也当成错误，使构建失败。本前端仍有约 87 条既有 lint 告警
      # （未使用的局部变量、react-hooks/exhaustive-deps），属技术债，
      # 不应在这一步阻塞构建。
      #
      # 关键点：**真正的编译期错误（语法错误、缺失导出、缺失依赖）
      # 不受该设置影响，仍然会让构建失败** —— 本轮修复的 11 处正是这一类，
      # 因此这道门禁依然能拦住它们。lint 告警见下方非阻塞报告步骤。
      - name: Production build
        run: npm run build
        env:
          CI: "false"

      # 前端单元测试：目前覆盖两类"构建与 lint 都发现不了"的缺陷 ——
      #   1. 导航死链：菜单项指向不存在的路由；
      #   2. 主题色分叉：antd token 与自定义 CSS 用了不同的品牌色，
      #      页面出现"两种蓝"。
      - name: Unit tests (navigation + theme guards)
        run: npx react-scripts test --watchAll=false
        env:
          CI: "true"

      # lint 报告：输出但不阻塞。待技术债清理完后可改为阻塞。
      - name: Lint report (non-blocking)
        continue-on-error: true
        run: npx eslint src --ext .js --format unix | tail -50

