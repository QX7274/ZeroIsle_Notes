apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

// 添加react-native-vector-icons配置
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.zeroisle_notes"
    defaultConfig {
        applicationId "com.zeroisle_notes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // 指定react-native-camera使用的变体
        missingDimensionStrategy 'react-native-camera', 'general'

        // 支持所有架构
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    // 确保Hermes引擎正确配置
    react {
        hermesEnabled = true
        enableHermesOnlyInVariants = []
    }

    // 添加特殊配置来解决mergeDebugNativeLibs任务的问题
    gradle.taskGraph.whenReady { graph ->
        graph.allTasks.each { task ->
            if (task.name.contains('mergeDebugNativeLibs') || task.name.contains('mergeReleaseNativeLibs')) {
                task.inputs.files.each { file ->
                    if (!file.exists() && file.toString().contains('libhermes.so')) {
                        println "Warning: Missing file ${file} in task ${task.name}"
                    }
                }
            }
        }
    }


    // 添加 packaging 配置来解决重复文件的问题
    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/INDEX.LIST',
                'META-INF/io.netty.versions.properties',
                'META-INF/MANIFEST.MF',
                'META-INF/services/*'
            ]
            pickFirsts += ['META-INF/jersey-module-version']
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    buildFeatures {
        buildConfig true
    }
    
    // Kotlin 编译配置
    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += [
            "-Xjvm-default=all",
            "-Xopt-in=kotlin.RequiresOptIn"
        ]
    }
    
    // 编译选项
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    def fragment_version = "1.8.6"
    // Java language implementation
    implementation "androidx.fragment:fragment:$fragment_version"
    // Compose
    implementation "androidx.fragment:fragment-compose:$fragment_version"
    // Testing Fragments in Isolation
    debugImplementation "androidx.fragment:fragment-testing-manifest:$fragment_version"
    androidTestImplementation "androidx.fragment:fragment-testing:$fragment_version"
    implementation "androidx.activity:activity:1.10.1"

    // 排除重复的依赖
    implementation "androidx.core:core:1.9.0"
    implementation "androidx.annotation:annotation:1.6.0"

    // TensorFlow Lite依赖
    implementation('org.tensorflow:tensorflow-lite:2.9.0') {
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'org.tensorflow', module: 'tensorflow-lite-api'
    }
    implementation('org.tensorflow:tensorflow-lite-support:0.4.2') {
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'org.tensorflow', module: 'tensorflow-lite-support-api'
    }

    // 百度AI SDK依赖
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.google.code.gson:gson:2.9.0'

    //谷歌
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.cloud:google-cloud-translate:2.2.0'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:18.0.0'

    // Firebase 依赖
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'

    // 权限库
    implementation project(':react-native-permissions')

    // AndroidPdfViewer - PDF整体渲染库
    implementation 'com.github.barteksc:android-pdf-viewer:3.2.0-beta.1'

    // SQLite 已移除，因为项目已迁移到 MongoDB
}

// 在所有配置中排除react-native-pdf引入的冲突PDF库
configurations.all {
    exclude group: 'com.github.zacharee', module: 'AndroidPdfViewer'
}

// 解决依赖冲突
configurations.all {
    resolutionStrategy {
        // 强制使用特定版本的依赖
        force "androidx.appcompat:appcompat:1.6.1"
        force "androidx.legacy:legacy-support-v4:1.0.0"
        force "androidx.fragment:fragment:1.6.1"

        // 强制使用特定版本的 BouncyCastle
        force "org.bouncycastle:bcprov-jdk15to18:1.68"
        force "org.bouncycastle:bcpkix-jdk15to18:1.68"

        // 排除旧的 BouncyCastle 版本
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'

        // 排除旧的Android Support库
        exclude group: 'com.android.support', module: 'support-v4'
        exclude group: 'com.android.support', module: 'support-compat'
        exclude group: 'com.android.support', module: 'support-annotations'
    }
}

// 添加特殊任务来处理缺失的.so文件问题
task createPlaceholderLibs {
    doLast {
        def libsDir = new File("${buildDir}/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib")
        if (!libsDir.exists()) {
            libsDir.mkdirs()
        }

        ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"].each { arch ->
            def archDir = new File(libsDir, arch)
            if (!archDir.exists()) {
                archDir.mkdirs()
            }

            // 创建可能缺失的库文件占位符
            [
                "libhermes.so",
                "librrc_legacyviewmanagerinterop.so",
                "librrc_image.so",
                "librrc_text.so",
                "librrc_view.so",
                "libglog.so",
                "libfbjni.so",
                "libjsi.so",
                "libreactnativejni.so",
                "libfolly_runtime.so"
            ].each { libName ->
                def libFile = new File(archDir, libName)
                if (!libFile.exists()) {
                    libFile.createNewFile()
                    println "Created placeholder for ${libFile}"
                }
            }
        }
    }
}

// 确保在mergeDebugNativeLibs任务之前运行createPlaceholderLibs任务
tasks.whenTaskAdded { task ->
    if (task.name.contains('mergeDebugNativeLibs') || task.name.contains('stripDebugDebugSymbols')) {
        task.dependsOn createPlaceholderLibs
    }
}
