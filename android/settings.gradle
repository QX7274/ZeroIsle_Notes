pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }

plugins { id("com.facebook.react.settings") }

// 自动链接命令需要跨平台：Windows 走 cmd /c，macOS/Linux 直接调用 node。
def isWindowsHost = System.getProperty("os.name").toLowerCase().contains("windows")
def autolinkCommand = isWindowsHost
    ? ["cmd", "/c", "node", "node_modules\\@react-native-community\\cli\\build\\bin.js", "config"]
    : ["node", "node_modules/@react-native-community/cli/build/bin.js", "config"]

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(autolinkCommand)
}


rootProject.name = 'ZeroIsle_Notes'
include ':app'
include ':detox'
project(':detox').projectDir = new File(rootProject.projectDir, '../node_modules/detox/android/detox')
includeBuild('../node_modules/@react-native/gradle-plugin')

// 指定react-native-camera的变体
gradle.beforeProject { project ->
    if (project.name == 'react-native-camera') {
        project.ext.defaultVariant = 'general'
    }
}

// SQLite 已移除，因为项目已迁移到 MongoDB
