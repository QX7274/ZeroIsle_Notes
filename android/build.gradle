apply plugin: "com.facebook.react.rootproject"

def materializeSkiaNativeInputs = { Project skiaProject ->
    def transformsDir = new File(gradle.gradleUserHomeDir, "caches/${gradle.gradleVersion}/transforms")
    def cxxRoot = new File(skiaProject.buildDir, "intermediates/cxx")

    if (!transformsDir.exists() || !cxxRoot.exists()) {
        return
    }

    def expectedNativeLibs = [
        "libfbjni.so",
        "libreact_nativemodule_core.so",
        "libjsi.so",
        "libreactnativejni.so",
        "libruntimeexecutor.so",
        "libturbomodulejsijni.so",
    ] as Set

    def configuredArchitectures = (
        skiaProject.findProperty("reactNativeArchitectures")
            ?: rootProject.findProperty("reactNativeArchitectures")
            ?: "arm64-v8a"
    ).toString().split(",").collect { it.trim() }.findAll { it }

    cxxRoot.eachDirRecurse { dir ->
        if (dir.name != "obj") {
            return
        }

        configuredArchitectures.each { abi ->
            def abiDir = new File(dir, abi)
            if (!abiDir.exists()) {
                abiDir.mkdirs()
            }

            def availableNativeLibs = [:]

            skiaProject.fileTree(transformsDir) {
                include "**/jetified-react-android-*-debug/jni/${abi}/*.so"
                include "**/jetified-react-android-*-debug/prefab/modules/*/libs/android.${abi}/*.so"
                include "**/jetified-fbjni-*/jni/${abi}/*.so"
                include "**/jetified-fbjni-*/prefab/modules/fbjni/libs/android.${abi}/*.so"
            }.files.each { file ->
                if (expectedNativeLibs.contains(file.name) && !availableNativeLibs.containsKey(file.name)) {
                    availableNativeLibs[file.name] = file
                }
            }

            availableNativeLibs.values().each { nativeLib ->
                def targetLib = new File(abiDir, nativeLib.name)
                if (!targetLib.exists() || targetLib.length() != nativeLib.length()) {
                    skiaProject.copy {
                        from nativeLib
                        into abiDir
                    }
                }
            }
        }
    }
}

gradle.projectsEvaluated {
    subprojects { project ->
        project.plugins.withId("com.android.library") {
            def androidExtension = project.extensions.findByName("android")
            if (androidExtension != null) {
                androidExtension.defaultConfig {
                    minSdkVersion rootProject.ext.minSdkVersion
                }
            }
        }

        if (project.name == "shopify_react-native-skia") {
            def prewarmSkiaDebugNativeLibs = project.tasks.create("prewarmSkiaDebugNativeLibs") {
                group = "build"
                description = "Materializes imported React Native native libraries into Skia CXX obj directories before mergeDebugNativeLibs input validation."
                outputs.upToDateWhen { false }
                doLast {
                    materializeSkiaNativeInputs(project)
                }
            }

            project.tasks.configureEach { task ->
                if (
                    task.name.startsWith("buildCMake") ||
                    (task.name.startsWith("merge") && task.name.endsWith("NativeLibs"))
                ) {
                    task.doNotTrackState("Skia native tasks reference imported React Native .so files that are not materialized as local task inputs/outputs under Gradle 8.8.")
                }
                if (task.name.startsWith("buildCMakeDebug")) {
                    prewarmSkiaDebugNativeLibs.dependsOn(task)
                }

                if (task.name == "mergeDebugNativeLibs") {
                    task.dependsOn(prewarmSkiaDebugNativeLibs)
                }
            }
        }
    }
}

// 自定义任务来预下载依赖
task downloadDependencies() {
    doLast {
        println "\n\n开始预下载依赖..."
        configurations.all { configuration ->
            if (configuration.canBeResolved) {
                configuration.resolve()
            }
        }
        println "依赖预下载完成!\n\n"
    }
}

