# ==================================================
# ZeroIsle Notes - Docker Compose for Local Development
# ==================================================
version: '3.8'

services:
  # --- Backend API ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: zeroisle_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_ENV=development
      - DEBUG=True
      - SENTRY_DSN=${SENTRY_DSN}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
    depends_on:
      - redis
    volumes:
      - ./backend:/app  # Mount for dev hot-reload (remove in prod)
      - media_data:/app/media
    networks:
      - zeroisle_network
    restart: unless-stopped
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]  # Dev mode

  # --- Celery Worker ---
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: zeroisle_celery_worker
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
    networks:
      - zeroisle_network
    restart: unless-stopped
    command: ["celery", "-A", "backend", "worker", "-l", "INFO"]

  # --- Celery Beat (Scheduler) ---
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: zeroisle_celery_beat
    env_file:
      - ./backend/.env
    depends_on:
      - celery_worker
    networks:
      - zeroisle_network
    restart: unless-stopped
    command: ["celery", "-A", "backend", "beat", "-l", "INFO"]

  redis:
    image: redis:7-alpine
    container_name: zeroisle_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zeroisle_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MongoDB (Primary Database) ---
  mongodb:
    image: mongo:6
    container_name: zeroisle_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-changeme}
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - zeroisle_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Neo4j (Knowledge Graph) ---
  neo4j:
    image: neo4j:5
    container_name: zeroisle_neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - zeroisle_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

# --- Networks ---
networks:
  zeroisle_network:
    driver: bridge

# --- Volumes ---
volumes:
  media_data:
  redis_data:
  mongo_data:
  neo4j_data:
  neo4j_logs:

