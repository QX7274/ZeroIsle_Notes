version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: zeroisle_backend_prod
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "backend.asgi:application"]
    volumes:
      - static_volume:/app/static_collected
      - media_volume:/app/media
      - logs_volume:/app/logs
      # Mount DB for SQLite peristence if not using external DB
      - sqlite_data:/app/db_data
    environment:
      - DJANGO_ENV=production
      - DEBUG=False
      # DB path override for volume persistence (requires modifying settings or symlink)
      # For now assuming user handles DB via env or uses MongoDB mostly.
    env_file:
      - .env.production
    depends_on:
      - redis
      - mongodb
      - neo4j
    ports:
      - "8000:8000"
    networks:
      - zeroisle_net
    restart: always

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: zeroisle_worker_prod
    command: ["celery", "-A", "backend", "worker", "-l", "INFO"]
    env_file:
      - .env.production
    volumes:
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      - backend
      - redis
    networks:
      - zeroisle_net
    restart: always

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: zeroisle_beat_prod
    command: ["celery", "-A", "backend", "beat", "-l", "INFO"]
    env_file:
      - .env.production
    depends_on:
      - backend
      - redis
    networks:
      - zeroisle_net
    restart: always

  # Redis for Cache & Channel Layer
  redis:
    image: redis:7-alpine
    container_name: zeroisle_redis_prod
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - zeroisle_net
    restart: always

  # MongoDB
  mongodb:
    image: mongo:6
    container_name: zeroisle_mongo_prod
    volumes:
      - mongo_data:/data/db
    networks:
      - zeroisle_net
    restart: always

  # Neo4j
  neo4j:
    image: neo4j:5
    container_name: zeroisle_neo4j_prod
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
    networks:
      - zeroisle_net
    restart: always

  # Nginx (Optional, but recommended)
  # nginx: ...

volumes:
  static_volume:
  media_volume:
  logs_volume:
  sqlite_data:
  redis_data:
  mongo_data:
  neo4j_data:

networks:
  zeroisle_net:
    driver: bridge
